<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5A2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233E5A2E'/%3E%3Cellipse cx='16' cy='22' rx='7' ry='6.5' fill='%23D64545'/%3E%3Cellipse cx='16' cy='9' rx='3.5' ry='5' fill='%23C0392B'/%3E%3Ccircle cx='13.5' cy='21' r='1.2' fill='%23271F17'/%3E%3Ccircle cx='18.5' cy='21' r='1.2' fill='%23271F17'/%3E%3C/svg%3E">
<title>Pikmin Blog v3</title>
<style>
/* ============================================================
   PIKMIN BLOG v3 — theme
   Palette: leaf green, sprout yellow, soil brown, petal pink.
   ============================================================ */
:root{
  --leaf:#3E5A2E; --leaf-2:#5C7F42; --leaf-3:#8FB56A;
  --sprout:#F2C230; --sprout-2:#FFE08A;
  --soil:#4A3527; --soil-2:#6B4E3A; --bark:#8A6A50;
  --petal:#E88BA6; --petal-2:#F6C6D5;
  --sky:#DCEBF5; --sky-2:#F1F7FB;
  --bud:#E4572E;            /* the red Pikmin leaf */
  --paper:#FFFDF7;
  --ink:#2E2A24; --ink-2:#5A5148; --ink-3:#8B8078;
  --line:#E2DACB;
  --ok:#3F9B4F; --warn:#D98A14; --bad:#C0392B;
  --r:16px; --r-sm:10px; --r-lg:26px;
  --shadow:0 2px 0 rgba(74,53,39,.10), 0 8px 24px rgba(74,53,39,.10);
  --shadow-sm:0 1px 0 rgba(74,53,39,.10), 0 3px 10px rgba(74,53,39,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #EAF4DC 0, transparent 42%),
    radial-gradient(circle at 88% 4%, #FDF0D2 0, transparent 38%),
    linear-gradient(180deg,var(--sky-2) 0,#F7FAF0 55%,#EFF6E4 100%);
  background-attachment:fixed;
  min-height:100dvh; line-height:1.55; font-size:16px;
}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.28rem} h3{font-size:1.08rem}
p{margin:.4rem 0}
a{color:var(--leaf-2);text-decoration:none;border-bottom:1.5px solid var(--leaf-3)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- layout ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 18px 64px}
.wrap-narrow{max-width:620px}
.center{display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:10px;align-items:center}
.row-wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grow{flex:1;min-width:0}
.tc{text-align:center}
.muted{color:var(--ink-3)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.hide{display:none!important}
.mt{margin-top:18px} .mt-sm{margin-top:9px} .mb{margin-bottom:18px}

/* ---------- cards ---------- */
.card{
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);
}
.card-lift{box-shadow:var(--shadow)}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:999px;font-weight:800;font-size:.95rem;
  background:var(--leaf);color:#fff;border:2px solid transparent;
  box-shadow:0 3px 0 #2C421F;transition:transform .07s,box-shadow .07s,background .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--leaf-2)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #2C421F}
.btn-sun{background:var(--sprout);color:#4A3527;box-shadow:0 3px 0 #C99A16}
.btn-sun:hover{background:var(--sprout-2)}
.btn-sun:active{box-shadow:0 0 0 #C99A16}
.btn-ghost{background:#fff;color:var(--leaf);border:2px solid var(--leaf-3);box-shadow:0 3px 0 #D8E6C4}
.btn-ghost:hover{background:#F4FAEC}
.btn-ghost:active{box-shadow:0 0 0 #D8E6C4}
.btn-quiet{background:#F2EDE2;color:var(--ink-2);box-shadow:0 3px 0 #DFD6C4}
.btn-quiet:hover{background:#EAE2D3}
.btn-quiet:active{box-shadow:0 0 0 #DFD6C4}
.btn-danger{background:var(--bad);box-shadow:0 3px 0 #8E2A1F}
.btn-danger:hover{background:#D4483A}
.btn-sm{padding:7px 14px;font-size:.86rem;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-lg{padding:15px 30px;font-size:1.06rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}

/* ---------- inputs ---------- */
.input,textarea.input{
  width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-sm);
  background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--leaf-3);box-shadow:0 0 0 4px rgba(143,181,106,.18)}
textarea.input{resize:vertical;min-height:120px;line-height:1.6;font-size:1.02rem}
label.fld{display:block;margin:14px 0 0}
label.fld span{display:block;font-weight:800;font-size:.83rem;color:var(--ink-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,253,247,.92);
  backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line);
}
.topbar-in{max-width:940px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;color:var(--leaf)}
.tab{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;
  font-weight:800;font-size:.88rem;background:#F2EDE2;color:var(--ink-2);border:2px solid transparent;
}
.tab:hover{background:#E9E1D2}
.tab.on{background:var(--leaf);color:#fff}
.tab .lbl{display:inline}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(160deg,#EAF6DA 0,#FFF7E2 55%,#FDEFF3 100%);
  border:2px solid #DDEBC6;border-radius:var(--r-lg);
  padding:30px 26px;margin:22px 0 24px;box-shadow:var(--shadow-sm);
}

/* ---------- pikmin avatars ----------
   --s is the body diameter. The box is taller than the body so the leaf has
   headroom INSIDE the element — that way no container can ever clip it, and
   no call site needs a wrapper. The body is drawn as an inset pseudo-element
   on ::before-free real estate: the span itself is the transparent box. */
.pik{
  display:inline-block;position:relative;flex:none;
  width:var(--s);height:calc(var(--s) * 1.42);
  transition:transform .15s ease;
}
.pik:hover{transform:translateY(-2px)}
/* the body */
.pik::before{
  content:"";position:absolute;left:0;bottom:0;
  width:var(--s);height:var(--s);
  border-radius:50% 50% 46% 46%;
  border:2.5px solid rgba(0,0,0,.11);
  background:var(--body);
  box-shadow:
    inset 0 -5px 10px rgba(0,0,0,.14),
    inset 0 5px 10px rgba(255,255,255,.28),
    0 2px 4px rgba(0,0,0,.08);
  box-sizing:border-box;
}
/* the leaf */
.pik::after{
  content:"";position:absolute;left:50%;top:2%;
  width:calc(var(--s) * .36);height:calc(var(--s) * .34);
  transform:translateX(-6%) rotate(16deg);
  background:var(--leafc);
  border-radius:60% 10% 60% 10%;
  box-shadow:inset -1px -2px 4px rgba(0,0,0,.18);
}
/* the stalk + the eyes ride in one child element */
.pik > i{position:absolute;inset:0;display:block;pointer-events:none}
.pik > i::before{ /* stalk */
  content:"";position:absolute;left:50%;top:20%;
  width:calc(var(--s) * .13);height:calc(var(--s) * .26);
  transform:translateX(-50%);
  background:var(--leafc);
  border-radius:3px;
  filter:brightness(.82);
}
.pik > i::after{ /* eyes */
  content:"";position:absolute;left:50%;bottom:calc(var(--s) * .36);
  width:calc(var(--s) * .50);height:calc(var(--s) * .16);
  transform:translateX(-50%);
  background:
    radial-gradient(circle at 25% 50%, #271F17 2.2px, transparent 2.6px),
    radial-gradient(circle at 75% 50%, #271F17 2.2px, transparent 2.6px);
}
.pik-sm{--s:32px}
.pik-md{--s:50px}
.pik-lg{--s:80px}
.pik-lg::before{border-width:3px}

/* ---------- kid cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.kidcard{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r);
  padding:18px 14px;text-align:center;box-shadow:var(--shadow-sm);
  transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;
}
.kidcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--leaf-3)}
.kidcard:hover .pik{transform:scale(1.12) translateY(-3px)}
.kidcard .nm{font-weight:900;margin-top:9px;font-size:1.05rem}
.kidcard .ct{color:var(--ink-3);font-size:.8rem;font-weight:700}
.kidcard-dashed{
  border:2.5px dashed var(--bark);background:rgba(255,255,255,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;
}
.kidcard-dashed:hover{border-color:var(--leaf-2);background:#F6FBEF}

/* ---------- story list ---------- */
.story{
  display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:var(--r);
  background:var(--paper);border:1.5px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .1s,border-color .15s;
}
.story:hover{transform:translateX(3px);border-color:var(--leaf-3)}
.story .ttl{font-weight:800;font-size:1.04rem}
.story .meta{color:var(--ink-3);font-size:.79rem;font-weight:700;margin-top:2px}
.story .excerpt{color:var(--ink-2);font-size:.9rem;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;
  font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
}
.b-sprout{background:#EAF3DC;color:#4B6B2C}
.b-wait{background:#FDF0D2;color:#8A6412}
.b-bloom{background:#E4F3E6;color:#2F7A3D}

/* ---------- editor ---------- */
.editor-wrap{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#F7F3EA;border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:7px;margin-bottom:9px}
.tool{width:38px;height:38px;border-radius:8px;background:#fff;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem}
.tool:hover{background:#F2F8E8;border-color:var(--leaf-3)}
.tool.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}

/* ---------- drawing ---------- */
.canvas-box{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:9px;margin-top:12px}
canvas.draw{width:100%;height:auto;display:block;border-radius:9px;touch-action:none;
  background:#fff;cursor:crosshair;border:1.5px dashed var(--line)}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;align-items:flex-end}
/* the drawing palette: flat ink dots, one per pen colour */
.sw{
  width:32px;height:32px;border-radius:50%;
  border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line);
  transition:transform .12s,box-shadow .12s;
}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 3px var(--leaf);transform:scale(1.1)}
/* the Pikmin picker: each swatch holds a real mini avatar instead */
.swatches-pik{gap:8px}
.swatches-pik .sw{
  width:auto;height:auto;border-radius:12px;border:2px solid transparent;
  background:#fff;padding:2px 3px 0;line-height:0;
  transition:transform .12s,box-shadow .12s,background .12s;
}
.swatches-pik .sw:hover{transform:translateY(-2px);background:#F6FBEF}
.swatches-pik .sw.on{box-shadow:0 0 0 2.5px var(--leaf);background:#F1F8E6}
.swatches-pik .pik{--s:30px}

/* ---------- pics strip ---------- */
.pics{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.pic{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;
  border:2px solid var(--line);background:#F4F0E6}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(192,57,43,.94);color:#fff;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.pic .dot{position:absolute;bottom:3px;left:3px;width:11px;height:11px;border-radius:50%;
  background:var(--ink-3);border:2px solid #fff}

/* ---------- misc ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  background:#F2EDE2;font-size:.8rem;font-weight:800;color:var(--ink-2)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--soil);color:#fff;padding:12px 22px;border-radius:999px;
  font-weight:800;font-size:.9rem;z-index:200;box-shadow:var(--shadow);
  opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.up{transform:translateX(-50%) translateY(0);opacity:1}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty .big{font-size:2.6rem;margin-bottom:8px}
hr.sep{border:0;border-top:1.5px dashed var(--line);margin:19px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3);font-weight:700}
.kv .v{font-weight:800;text-align:right;word-break:break-word}
.logbox{background:#2E2A24;color:#D8E8C8;border-radius:var(--r);padding:14px;
  font-family:var(--mono);font-size:.79rem;max-height:300px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.gate{
  position:fixed;inset:0;z-index:300;background:rgba(46,42,36,.55);
  backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;
}
.gate .box{background:var(--paper);border-radius:var(--r-lg);padding:28px;max-width:390px;width:100%;box-shadow:var(--shadow)}
.dot-line{display:flex;gap:9px;justify-content:center;margin:9px 0}
.dot-line i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dot-line i.on{background:var(--leaf)}
.wordbar{height:8px;background:#EFE8DA;border-radius:99px;overflow:hidden;margin-top:7px}
.wordbar span{display:block;height:100%;background:var(--leaf-3);transition:width .2s}
.wordbar span.over{background:var(--warn)}
@media(max-width:560px){
  .wrap{padding:0 13px 54px}
  h1{font-size:1.42rem}
  .panel,.editor-wrap{padding:16px;border-radius:20px}
  .hero{padding:22px 17px}
  .tab .lbl{display:none}
  .tab{padding:9px 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .btn{padding:11px 16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="gate"></div>

<script>
"use strict";
/* ============================================================================
   PIKMIN BLOG v3
   A writing app for children. Built fresh 2026-09-27.

   Shape of the thing
   ------------------
     Cloud    - the ONLY code that talks to the Apps Script backend
     DB       - { kids:[], posts:[], deleted:[] }  the whole world (in memory)
     render() - the ONLY code that writes to the page

   Storage rule: NOTHING is stored locally. The Google Sheet is the sole source
   of truth for all data. Every reload fetches fresh from the cloud. The device
   holds no state between visits — not stories, not kids, not settings, not
   session. This is a deliberate privacy choice.
   ============================================================================ */


/* ==========================================================================
   1. CONSTANTS
   ========================================================================== */

const BUILD = 'v3.1.9';

/* NOTE: All localStorage keys are removed. The Google Sheet and Google Drive
   are the sole sources of truth. Nothing is stored on the device — not stories,
   not kids, not settings, not session state. Every reload starts fresh and
   fetches everything from the cloud. */

/* Replace these two after you set up your own Sheet. See SETUP guide.

   HONEST NOTE: whatever you put here is visible to anyone who opens the page,
   including on a public GitHub Pages site. It is a doorbell, not a lock.
   What actually protects the family is the SHARING SETTINGS on the Sheet
   itself — leave it private, or shared only with your own Google account. */
const DEFAULT_BACKEND = {
  url:   'https://script.google.com/macros/s/AKfycbzws40cS8CzCOzHB82oWURV89GaGYWdhg2LTYCEk03fUJbAi78TlhgkorUVEUL9OxzoSQ/exec',
  token: 'ngkaixuen_ngyeeching',
  folderId: '1Ec8nu9gqoowAnnIoejzUj17K4YM0Qas0',
  folderUrl: 'https://drive.google.com/drive/folders/1Ec8nu9gqoowAnnIoejzUj17K4YM0Qas0'
};

/* Pikmin colours a child can pick. Red/orange/yellow/blue/white/purple. */
const PIKMIN = [
  { id:'red',    name:'Red',    body:'#D64545', leaf:'#C0392B' },
  { id:'yellow', name:'Yellow', body:'#F2C230', leaf:'#D6A21A' },
  { id:'blue',   name:'Blue',   body:'#4A90D9', leaf:'#3A72AD' },
  { id:'purple', name:'Purple', body:'#9B6BC4', leaf:'#7C519E' },
  { id:'white',  name:'White',  body:'#F0EDE4', leaf:'#B3AC96' },
  { id:'rock',   name:'Rock',   body:'#8A8577', leaf:'#6E6A5E' }
];

const STATUS = {
  draft:     { label:'Sprout',   cls:'b-sprout' },
  pending:   { label:'Waiting',  cls:'b-wait'   },
  published: { label:'Bloomed',  cls:'b-bloom'  }
};

const MAX_WORDS_DEFAULT = 400;
const AUTOSAVE_MS = 800;
const PUSH_DEBOUNCE_MS = 1600;
const PIC_MAX_EDGE = 1400;        /* drawings/photos are shrunk to this */
const PIC_JPEG_Q = 0.82;

/* ---- how long a Sheet call may take -------------------------------------
   One attempt gets READ_TIMEOUT_MS. A healthy read answers in 3–6s; a cold
   Apps Script deployment can take 20s+ to wake, which is what the retry is
   for. After a timeout the deployment is definitely awake, so the next
   attempt returns quickly. */
const READ_TIMEOUT_MS  = 25000;
const READ_ATTEMPTS    = 3;
const READ_GAP_MS      = 1200;    /* base gap between attempts; widens each time */
const WRITE_TIMEOUT_MS = 30000;

/* The longest a read can legitimately take, gaps included. */
function readBudgetMs(){
  let total = READ_ATTEMPTS * READ_TIMEOUT_MS;
  for(let i = 1; i < READ_ATTEMPTS; i++) total += READ_GAP_MS * i;
  return total;
}
/* The watchdog must OUTLAST the whole retry budget. If it were shorter it
   would report failure while a retry was still legitimately in flight — which
   is exactly the bug this replaced. Derived, never guessed, so the two can
   never drift apart again. */
function watchdogMs(){
  return Math.max(readBudgetMs(), WRITE_TIMEOUT_MS) + 12000;
}


/* ==========================================================================
   2. STORE — removed. No localStorage.
   ========================================================================== */

/* All data lives in the Google Sheet and Drive. The device holds nothing
   between reloads. Settings are rebuilt from hardcoded defaults every time.
   Session and unlocked state are in-memory only. */

function freshDB(){ return { kids:[], posts:[], deleted:[] }; }

/* Settings are saved on the device, and a saved PIN always won — so changing
   DEFAULT_PIN did nothing on a device that had already run the app: it kept the
   old value forever, and only a brand-new device picked the new one up.
   The PIN is shipped configuration, not a per-device preference, so the old
   value is migrated once and the shipped one wins from then on. Only this exact
   retired value is touched; any other PIN a grown-up set is left alone. */
const RETIRED_PINS = ['123456'];

/* Every settings object is built here, so nothing downstream can meet a
   half-formed one. Missing pieces are filled from defaults. */
function normalizeSettings(s){
  const d = DEFAULT_BACKEND;
  const src = s && typeof s === 'object' ? s : {};
  const cloud = src.cloud && typeof src.cloud === 'object' ? src.cloud : {};
  const pin = typeof src.pin === 'string' ? src.pin : DEFAULT_PIN;
  return {
    requireApproval: src.requireApproval !== false,
    wordLimit:       Number(src.wordLimit) > 0 ? Number(src.wordLimit) : MAX_WORDS_DEFAULT,
    grownUpName:     typeof src.grownUpName === 'string' && src.grownUpName.trim()
                       ? src.grownUpName.trim() : 'Grown-up',
    pin:             RETIRED_PINS.indexOf(pin) >= 0 ? DEFAULT_PIN : pin,
    cloud: {
      url:       typeof cloud.url      === 'string' ? cloud.url      : d.url,
      token:     typeof cloud.token    === 'string' ? cloud.token    : d.token,
      folderId:  typeof cloud.folderId === 'string' ? cloud.folderId : d.folderId,
      folderUrl: typeof cloud.folderUrl=== 'string' ? cloud.folderUrl: d.folderUrl,
      autoPush:  cloud.autoPush  !== false,   /* back up every change  */
      pullOnOpen:cloud.pullOnOpen!== false,   /* check on open         */
      lastSync:  cloud.lastSync || null,
      lastError: cloud.lastError || null
    }
  };
}
const DEFAULT_PIN = '489487';

/* The family password is kept as a hash, not the words themselves.
   NOTE: a hash here stops a casual reader of the page source from reading the
   password off the screen. It does NOT make this a secure login — anyone who can
   read the JavaScript can brute-force a short password offline in moments. What
   it protects against is the honest threat: a stranger who finds the link, and a
   child who has not been given the password. */
function hashPw(s){
  let h = 5381;
  for(const ch of ('pbv3::' + String(s))) h = (((h << 5) + h) + ch.charCodeAt(0)) >>> 0;
  return h.toString(36);
}
const FAMILY_PW_HASHES = [
  hashPw('ngkimhooi'),
  hashPw('ngkaixuen'),
  hashPw('ngyeeching')
];

function pwOk(entry){
  const t = String(entry || '').trim().toLowerCase();
  if(!t) return false;
  return FAMILY_PW_HASHES.indexOf(hashPw(t)) >= 0;
}

   3. STATE
   ========================================================================== */

/* DB starts empty and is filled from the Sheet on every load. It lives only
   in memory — never written to localStorage. */
let DB         = freshDB();
let SET        = normalizeSettings(null);   /* rebuilt from hardcoded defaults every reload */
let SESSION    = null;                      /* {kidId} or {grownUp:true} — in-memory only */
let VIEW       = { name:'profiles', postId:null, kidId:null };
let DRAFT      = null;                      /* only while the editor is open */
let BUSY       = false;                     /* a network call is in flight */
let CLOUD_STATE= { status:'idle', message:'' };

/* The login wall. Until this is true the app renders nothing but the sign-in
   card — no kids, no stories, no chips. It is a separate flag from SESSION
   because two different questions are being asked:
     LOCKED  -> "may this person use the app at all?"      (the family password)
     SESSION -> "which child, or is this a grown-up?"      (chosen after login)
   Clearing SESSION (Lock) must NOT throw the user back to the login card.

   With no localStorage, LOCKED is always true on reload — the password must be
   entered every time. This is the price of storing nothing on the device. */
let LOCKED     = true;
let LOGIN_ERR  = '';

let saveTimer  = null;
let pushTimer  = null;
let suppressPush = false;               /* held across a pull */
let pulledOnce  = false;
let pullPromise = null;

   4. SMALL HELPERS
   ========================================================================== */

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function wordCount(t){
  const m = String(t || '').trim().match(/\S+/g);
  return m ? m.length : 0;
}
function timeAgo(ms){
  if(!ms) return 'never';
  const s = Math.floor((Date.now() - ms) / 1000);
  if(s < 45)      return 'just now';
  if(s < 90)      return 'a minute ago';
  if(s < 3600)    return Math.floor(s/60) + ' min ago';
  if(s < 86400)   return Math.floor(s/3600) + ' h ago';
  if(s < 604800)  return Math.floor(s/86400) + ' d ago';
  return new Date(ms).toLocaleDateString();
}
function dayLabel(ms){

}

function pikminOf(id){ return PIKMIN.find(p => p.id === id) || PIKMIN[0]; }

/* The Pikmin colour a kid should be drawn as. Tolerates a Sheet written by an

/* ==========================================================================
   5. LOCAL SAVE  (removed — nothing stored locally)
   ========================================================================== */

/* The Google Sheet is the sole source of truth. Every mutation pushes
   immediately. There is no local copy, no debounce, no offline queue, no
   localStorage. The device is a thin client; all state lives in the cloud.
   The old scheduleSave/saveNow are replaced by pushToSheet() calls. */

function isSuppressing(){ return suppressPush; }
function cancelPush(){ clearTimeout(pushTimer); }
function hasPendingPush(){ return !!pushTimer; }


/* ==========================================================================
   6. CLOUD — the only code that talks to the backend
   ========================================================================== */

function cloudCfg(){ return SET.cloud || DEFAULT_BACKEND; }
function cloudReady(){
  const c = cloudCfg();
  return !!(c.url && c.token && c.url.indexOf('https://script.google.com/') === 0);
}
function folderReady(){
  const c = cloudCfg();
  return !!(c.folderId || c.folderUrl);
}
function driveFolderId(){
  const c = cloudCfg();
  /* The LINK wins over the bare id. Both are set by shipping, and a grown-up
     edits the link — so if the two ever disagree, the one they can see is the
     one they meant. A bare id is only used when there is no link at all. */
  const m = String(c.folderUrl || '').match(/\/folders\/([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  return c.folderId || '';
}
function setCloudState(status, message){
  const changed = (CLOUD_STATE.status !== status) || (CLOUD_STATE.message !== (message || ''));
  CLOUD_STATE = { status: status, message: message || '' };
  /* The status strip lives in the DOM, so a state change with no repaint shows
     the OLD message forever — that is what left "Reading the Sheet…" on screen
     after the read had already finished. Repaint whenever it actually changes,
     but never re-enter render() from inside a render pass. */
  if(changed && !rendering) repaint();
}

let rendering = false;      /* guard: render() must not recurse into itself */
let repaintQueued = false;  /* coalesce bursts of state changes into one frame  */
function repaint(){
  if(typeof window === 'undefined') return;
  if(repaintQueued) return;
  repaintQueued = true;
  const run = () => { repaintQueued = false; try{ render(); }catch(e){} };
  if(typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(run);
  else setTimeout(run, 0);
}

/* ---- JSONP read ----------------------------------------------------------
   Apps Script answers a GET with a 302 to script.googleusercontent.com. A
   plain fetch cannot follow that and read the body, so reads go through a
   <script> tag carrying ?callback=NAME. */
function jsonp(action, extra, timeoutMs){
  return new Promise((resolve, reject) => {
    const c = cloudCfg();
    if(!cloudReady()) return reject(new Error('No Sheet is set up yet.'));

    const name = 'pbcb_' + Math.random().toString(36).slice(2, 9);
    const params = new URLSearchParams();
    params.set('action', action);
    params.set('token', c.token);
    params.set('callback', name);
    Object.keys(extra || {}).forEach(k => params.set(k, extra[k]));

    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      done = true;
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => {
      if(done) return;
      cleanup();
      const err = new Error('The Sheet did not answer in time.');
      err.transient = true;        /* a cold start, not a bad URL — safe to retry */
      reject(err);
    }, timeoutMs || 30000);

    window[name] = payload => {
      if(done) return;
      clearTimeout(timer);
      cleanup();
      if(payload && payload.ok) resolve(payload);
      else reject(new Error((payload && payload.error) || 'The script refused the request.'));
    };
    script.onerror = () => {
      if(done) return;
      clearTimeout(timer);
      cleanup();
      /* A <script> that fails to load tells us nothing about WHY. Most of the
         time it is a cold start or a dropped connection, so do not accuse the
         grown-up's URL of being wrong — say what we actually know. */
      const err = new Error('The Sheet could not be reached just now. '
        + 'It may simply be waking up.');
      err.transient = true;        /* a dropped connection is worth one more try */
      reject(err);
    };
    script.src = c.url + '?' + params.toString();
    document.body.appendChild(script);
  });
}

/* ---- POST write ----------------------------------------------------------
   text/plain avoids a CORS preflight. The reply is readable because Apps
   Script sends Access-Control-Allow-Origin: * on the redirect target. */
async function postTo(body, timeoutMs){
  const c = cloudCfg();
  if(!cloudReady()) throw new Error('No Sheet is set up yet.');

  const ctl  = new AbortController();
  const timer= setTimeout(() => ctl.abort(), timeoutMs || 30000);
  try{
    const res = await fetch(c.url, {
      method:'POST', redirect:'follow', signal:ctl.signal,
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token:c.token }, body))
    });
    const txt = await res.text();
    let j = null; try{ j = JSON.parse(txt); }catch(e){}
    if(!j){
      throw new Error('The script sent back a page instead of data (HTTP ' + res.status +
        '). Re-deploy it as a New version.');
    }
    if(!j.ok) throw new Error(j.error || 'The script refused the request.');
    return j;
  } finally { clearTimeout(timer); }
}


/* ---- the merge -----------------------------------------------------------
   Version clock, not last-write-wins:
     - newer updatedAt wins per story; on a tie the local copy wins (it has
       the pictures)
     - a story deleted elsewhere is never resurrected
     - an approval already given is never taken away
   Returns the merged db plus a flag for whether it differs from local. */
function mergeSnapshot(mine, theirs){
  const out   = { kids:[], posts:[], deleted:[] };
  const seen  = {};

  /* kids: union by id, newer name wins */
  const kidMap = {};
  (mine.kids || []).forEach(k => { kidMap[k.id] = Object.assign({}, k); });
  (theirs.kids || []).forEach(k => {
    if(!kidMap[k.id]) kidMap[k.id] = Object.assign({}, k);
    else if((k.createdAt||0) < (kidMap[k.id].createdAt||0)) kidMap[k.id] = Object.assign({}, k);
  });
  out.kids = Object.keys(kidMap).map(id => kidMap[id]);

  /* deletions are permanent — a union of both lists */
  const del = {};
  (mine.deleted   || []).forEach(id => { del[id] = 1; });
  (theirs.deleted || []).forEach(id => { del[id] = 1; });
  out.deleted = Object.keys(del);

  const postMap = {};
  (mine.posts   || []).forEach(p => { postMap[p.id] = Object.assign({}, p); });
  (theirs.posts || []).forEach(p => {
    const local = postMap[p.id];
    if(!local){ postMap[p.id] = Object.assign({}, p); return; }
    const lt = local.updatedAt || local.createdAt || 0;
    const tt = p.updatedAt || p.createdAt || 0;
    if(tt > lt){
      /* theirs is newer — but never lose a picture or an approval we hold */
      const merged = Object.assign({}, local, p);
      if((local.attachments||[]).length > (p.attachments||[]).length)
        merged.attachments = local.attachments;
      if(local.approvedAt && !p.approvedAt) merged.approvedAt = local.approvedAt;
      postMap[p.id] = merged;
    }
  });

  /* drop anything that was deleted anywhere */
  out.posts = Object.keys(postMap)
    .filter(id => !del[id])
    .map(id => postMap[id]);

  /* did anything actually change? */
  const sig = d => JSON.stringify({
    k:(d.kids||[]).map(x=>[x.id,x.name,x.pikmin,x.createdAt]).sort(),
    p:(d.posts||[]).map(x=>[x.id,x.updatedAt,x.status,x.title,x.body,
                            (x.attachments||[]).length,x.approvedAt||null]).sort(),
    d:(d.deleted||[]).slice().sort()
  });
  const changed = sig(mine) !== sig(out);
  return { db: out, changed: changed };
}

/* ---- read with a retry across a cold start --------------------------------
   An Apps Script deployment that nobody has touched for a while takes several
   seconds just to wake up — Google holds the request in its queue before the
   script runs at all (measured: ~2.7s on a warm-ish deployment, and it is not
   unusual for a cold one to blow past 20s). Treating that as a hard failure
   left the page saying "Reading the Sheet…" with nothing behind it.

   So: retry transient failures with a widening gap, and report the wait
   honestly rather than freezing on one word. */
async function readSheetWithRetry(attempts){
  const max = attempts || READ_ATTEMPTS;
  let last = null;
  for(let i = 0; i < max; i++){
    if(i > 0) setCloudState('reading', 'Still reading the Sheet… (' + (i + 1) + ' of ' + max + ')');
    try{
      return await jsonp('load', {}, READ_TIMEOUT_MS);
    }catch(e){
      last = e;
      if(!e.transient) throw e;          /* a bad token will never fix itself */
      if(i < max - 1) await new Promise(r => setTimeout(r, READ_GAP_MS * (i + 1)));
    }
  }
  throw last || new Error('The Sheet did not answer.');
}

/* ---- pull: read the Sheet and replace in --------------------------------- */
/* A generation counter, bumped by every LOCAL write (create/delete/rename).
   A pull captures it before it starts and checks it again before it lands.
   If the number moved, the device changed while the read was in flight — and
   the child's work must not be thrown away by an answer to a question that was
   asked before they pressed the button. See the note in pullFromSheet. */
let localEpoch = 0;
function bumpEpoch(){ localEpoch++; }

async function pullFromSheet(opts){
  const force = !!(opts && opts.force);
  if(!cloudReady()) return { ok:false, skipped:'no Sheet set up' };
  if(pulledOnce && !force) return { ok:true, skipped:'already read this session' };
  if(!force && !cloudCfg().pullOnOpen) return { ok:true, skipped:'check-on-open is off' };

  const wasSuppressed = suppressPush;
  const epochAtStart  = localEpoch;
  suppressPush = true;
  setCloudState('reading','Reading the Sheet…');
  armWatchdog();
  try{
    const r = await readSheetWithRetry(READ_ATTEMPTS);
    const remote = r.data || { kids:[], posts:[], deleted:[] };

    /* The Sheet is the sole source of truth: DB is REPLACED, not merged — no
       conflict resolution, no last-write-wins, nothing kept "just in case".
       That is the deliberate privacy design; the local copy is ephemeral.

       THE ONE EXCEPTION. If the device changed while this read was in flight,
       landing the answer would silently delete what was just created. That is
       not "the Sheet wins" — it is a stale answer to a question asked before
       the user acted. On a first load the read takes seconds, which is exactly
       when a child taps New Pikmin, so this is reachable in practice.

       So: if the epoch moved, the Sheet still wins on EVERYTHING it knows, and
       only the entries this device created after the read began are re-applied
       on top. Nothing the Sheet holds is lost, and nothing the child just made
       is thrown away. The next push (already queued by the create) carries it
       up for real. */
    if(localEpoch !== epochAtStart){
      const remoteKidIds = {};
      (remote.kids || []).forEach(k => { remoteKidIds[k.id] = 1; });
      const localOnlyKids = (DB.kids || []).filter(k => !remoteKidIds[k.id]);

      const remotePostIds = {};
      (remote.posts || []).forEach(p => { remotePostIds[p.id] = 1; });
      const localOnlyPosts = (DB.posts || []).filter(p => !remotePostIds[p.id]);

      /* Local deletions made during the read are honoured too: a tombstone the
         device added must survive the landing, or a story the child just
         deleted comes back from the Sheet. Union of both delete lists. */
      const del = {};
      (remote.deleted || []).forEach(id => { del[id] = 1; });
      (DB.deleted    || []).forEach(id => { del[id] = 1; });

      const keepK = (Array.isArray(remote.kids)  ? remote.kids  : []).concat(localOnlyKids);
      const keepP = (Array.isArray(remote.posts) ? remote.posts : []).concat(localOnlyPosts);

      /* A live id always beats a tombstone — never show something twice. The
         reverse is NOT true: a tombstone must outlive the row it names, or the
         very next push re-creates what the child deleted. So the Sheet's own
         rows are filtered by the tombstones, and the tombstone list is kept
         whole (minus ids that are genuinely alive on BOTH sides). */
      DB = {
        kids:    keepK.filter(k => !del[k.id]),
        posts:   keepP.filter(p => !del[p.id]),
        deleted: Object.keys(del)
      };
    } else {
      DB = {
        kids:    Array.isArray(remote.kids)    ? remote.kids    : [],
        posts:   Array.isArray(remote.posts)   ? remote.posts   : [],
        deleted: Array.isArray(remote.deleted) ? remote.deleted : []
      };
    }
    pulledOnce = true;
    const n = (DB.posts||[]).length;
    setCloudState('ok', n ? ('Up to date — ' + n + ' stor' + (n===1?'y':'ies') + '.')
                          : 'Connected. No stories yet.');
    return { ok:true, changed:true, posts:n };
  }catch(e){
    /* Say something a person can act on, and say it in the strip that is
       already on screen — never leave the spinner up with no explanation. */
    const tail = e.transient ? ' Tap here to try again.' : '';
    setCloudState('error', e.message + tail);
    return { ok:false, error:e.message };
  }finally{
    /* The operation is over, however it ended — disarm, or a later operation
       would inherit this one's deadline. */
    clearWatchdog();
    /* ALWAYS release, never restore a captured value. cloudPushSoon re-reads
       the grown-up's setting itself, so false is the only safe resting state. */
    if(!wasSuppressed) suppressPush = false;
    else suppressPush = false;
  }
}

/* ---- push: send everything up ------------------------------------------- */
async function pushToSheet(){
  if(!cloudReady()) return { ok:false, skipped:'no Sheet set up' };
  setCloudState('sending','Sending…');
  armWatchdog();
  try{
    const r = await postTo({
      action:'sync',
      data:{ kids:DB.kids, posts:DB.posts, deleted:DB.deleted }
    }, WRITE_TIMEOUT_MS);
    SET.cloud.lastSync  = Date.now();
    SET.cloud.lastError = null;
    /* Settings are not stored locally — no-op */
    const n = (DB.posts||[]).length;
    setCloudState('ok', 'Backed up — ' + n + ' stor' + (n===1?'y':'ies') + '.');
    return { ok:true, posts:n };
  }catch(e){
    SET.cloud.lastError = e.message;
    /* Settings are not stored locally — no-op */
    setCloudState('error', e.message);
    return { ok:false, error:e.message };
  }finally{
    clearWatchdog();
  }
}

/* Unbidden backup — respects the grown-up's switch. */
function pushSoon(delay){
  if(suppressPush) return;
  if(!cloudReady()) return;
  if(!cloudCfg().autoPush) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    pushTimer = null;
    if(suppressPush) return;
    pushToSheet();
  }, delay == null ? PUSH_DEBOUNCE_MS : delay);
}

/* Every successful login syncs. This is the promise that "log in anywhere and
   your work is there". It is NOT gated by the two switches, because logging in
   is a person asking — only a missing Sheet may stop it.
   NOTE: it deliberately runs on every login, not once per page load, so a
   second child on the same tablet still reads the Sheet. */
let loginSyncPromise = null;
function syncOnLogin(){
  if(loginSyncPromise) return loginSyncPromise;
  if(!cloudReady()){
    setCloudState('idle','Not connected to a Sheet yet.');
    return Promise.resolve({ ok:false, skipped:'no Sheet set up' });
  }
  loginSyncPromise = (async () => {
    /* Pull only — the user has not made any changes yet, so there is nothing
       to push. The initial load brings the Sheet's data into memory. */
    let read = { ok:false };
    try{
      read = await pullFromSheet({ force:true });
    }catch(e){ read = { ok:false, error:e.message }; }

    if(read.ok){
      const n = (DB.posts||[]).length;
      setCloudState('ok','Synced — ' + n + ' stor' + (n===1?'y':'ies') + '.');
    }
    return { read:read };
  })().catch(e => {
    setCloudState('error', e.message);
    return { ok:false, error:e.message };
  }).then(r => { loginSyncPromise = null; return r; });

  return loginSyncPromise;
}

/* ---- health check --------------------------------------------------------
   Reports what is ACTUALLY on the Sheet, not just whether the URL answers.
   A check that never reads the data sends people hunting in the wrong place. */
async function runDoctor(){
  const lines = [];
  const c = cloudCfg();
  lines.push('App build: ' + BUILD);
  lines.push('Sheet URL: ' + (c.url ? c.url.slice(0,62) + '…' : '(none)'));
  lines.push('Drive folder: ' + (driveFolderId() || '(none)'));
  lines.push('Stories on this device: ' + (DB.posts||[]).length);
  lines.push('');

  if(!cloudReady()){ lines.push('STOP: no Sheet URL set. Paste one in Settings.'); return lines.join('\n'); }

  lines.push('Asking the Sheet…');
  try{
    const p = await jsonp('ping', {}, 20000);
    lines.push('  answered at ' + (p.at || '?'));
    lines.push('  tabs: ' + ((p.tabs||[]).join(', ') || '(none)'));
    if(p.lastBackup) lines.push('  last backup: ' + p.lastBackup);
    else lines.push('  NO lastBackup in the reply -> this deployment is OLD.');
    if(p.drive)      lines.push('  drive: ' + (p.drive.ok ? ('OK (' + p.drive.name + ')')
                                             : ('problem — ' + p.drive.error)));
    else             lines.push('  NO drive in the reply -> pictures will not upload.');
  }catch(e){
    lines.push('  FAILED: ' + e.message);
  }

  lines.push('');
  lines.push('Reading the Sheet…');
  try{
    const r = await jsonp('load', {}, 20000);
    const d = r.data || {};
    lines.push('  stories on the Sheet: ' + ((d.posts||[]).length));
    lines.push('  Pikmin on the Sheet: ' + ((d.kids||[]).length));
    if((d.posts||[]).length === 0 && (DB.posts||[]).length > 0)
      lines.push('  !! the Sheet is EMPTY while this device holds stories.');
  }catch(e){
    lines.push('  FAILED: ' + e.message);
  }

  /* Reading and WRITING are different abilities, and a deployment can have one
     without the other. A deployment that answers `load` but refuses `sync` looks
     perfectly healthy right up until a child presses Save and their story is
     lost. Ask it directly: send the current snapshot straight back. This is
     idempotent — it writes what is already stored — so it cannot corrupt
     anything, and it is the only way to know before the child finds out. */
  lines.push('');
  lines.push('Testing a save (writes the same data back, nothing lost)…');
  try{
    const w = await postTo({
      action:'sync',
      data:{ kids:DB.kids, posts:DB.posts, deleted:DB.deleted }
    }, 20000);
    lines.push('  save answered OK' + (w && w.posts != null ? (' (' + w.posts + ' stories)') : ''));
  }catch(e){
    const m = String(e.message || e);
    lines.push('  FAILED: ' + m);
    if(/unknown action/i.test(m))
      lines.push('  !! this deployment is OLDER than the app: it has no "sync".');
    else if(/bad token/i.test(m))
      lines.push('  !! the token does not match SECRET in the Apps Script.');
  }
  return lines.join('\n');
}


/* ==========================================================================
   7. PICTURES — shrink, then send to Drive
   ========================================================================== */

/* ---- resolve a picture to something an <img> can load --------------------
   An attachment can be in one of three states, and all three must render:
     - just drawn/attached, not yet uploaded → `src` holds an inline data URL
     - uploaded                              → `src` is blanked, `driveId` and
                                               `url` hold the Drive reference
     - read back from the Sheet              → same as uploaded, and `thumb`
                                               may be absent

   This must be ONE function. Three separate call sites each remembered a
   different subset of the fields, so a picture that survived one screen
   vanished on another — the read view forgot `url` entirely, which is exactly
   the state every uploaded picture is in. */
function picUrl(att){
  if(!att) return '';
  if(att.thumb) return att.thumb;       /* local preview, fastest */
  if(att.src)   return att.src;         /* not uploaded yet */
  if(att.url)   return att.url;         /* Drive's own link */
  /* Last resort: build a thumbnail straight from the file id. This works for
     a file the signed-in user can see, and needs no extra API call. */
  if(att.driveId) return 'https://drive.google.com/thumbnail?id=' + att.driveId + '&sz=w1000';
  return '';
}
function hasPic(att){ return !!picUrl(att); }

function shrinkImage(dataUrl){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, PIC_MAX_EDGE / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0,0,w,h);   /* drawings may have alpha */
      g.drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', PIC_JPEG_Q));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function uploadPicture(att, ctx){
  if(!cloudReady())      throw new Error('No Sheet is set up, so pictures cannot be filed.');
  if(!driveFolderId())   throw new Error('No Drive folder is set. Paste a folder link in Settings.');

  const small = await shrinkImage(att.src);
  const r = await postTo({
    action:'uploadImage',
    folderId: driveFolderId(),
    dataUrl:  small,
    kidId:    ctx.kidId   || '',
    kidName:  ctx.kidName || '',
    postId:   ctx.postId  || '',
    postTitle:ctx.title   || ''
  }, 45000);

  att.src    = '';            /* the picture now lives in Drive */
  att.driveId= r.fileId;
  att.url    = r.url;
  /* DROP the local preview, do not keep it. `thumb` is a full-size `data:`
     URL — a single picture is ~200 KB, and a story can hold several. Pushing
     that to the Sheet overflowed the 50,000-character cell, so the backend
     dropped the WHOLE attachment list and every picture vanished on the next
     sign-in. The picture is in Drive now; picUrl() draws it from `url`/`driveId`,
     which is exactly the "read back from the Sheet" state. Keeping the data URL
     here only risks the same overflow again. */
  att.thumb  = '';
  return r;
}


/* ==========================================================================
   8. RENDER
   ========================================================================== */

function render(){
  const app = $('#app');
  rendering = true;
  let carried = null;
  try{
    /* The login wall comes first, and returns early. Nothing below it runs
       while locked, so no story text ever reaches the DOM. */
    if(LOCKED){
      app.innerHTML = viewLogin();
      renderGate();
      focusLoginInput();
      return;
    }

    /* The drawing pad is injected into an empty #drawBox at runtime, so a
       re-render would silently throw away a half-finished picture. Carry it
       across. This matters because setCloudState can now repaint at any
       moment — a child must never lose a drawing to a background sync. */
    if(VIEW.name === 'editor'){
      const box = $('#drawBox');
      if(box && box.innerHTML){
        const cv = $('#cv');
        carried = { html: box.innerHTML, png: cv ? cv.toDataURL('image/png') : null };
      }
    }

    if     (VIEW.name === 'profiles') app.innerHTML = viewProfiles();
    else if(VIEW.name === 'kid')      app.innerHTML = viewKid();
    else if(VIEW.name === 'editor')   app.innerHTML = viewEditor();
    else if(VIEW.name === 'read')     app.innerHTML = viewRead();
    else if(VIEW.name === 'log')      app.innerHTML = viewLog();
    else if(VIEW.name === 'newKid')   app.innerHTML = viewNewKid();
    else app.innerHTML = viewProfiles();
    renderGate();

    if(carried){
      const box = $('#drawBox');
      if(box){
        box.innerHTML = carried.html;
        initCanvas();               /* rebind pointer events to the fresh canvas */
        /* put the pixels back — initCanvas clears the canvas to white */
        if(carried.png && CANVAS.ctx){
          const img = new Image();
          img.onload = () => {
            try{
              CANVAS.ctx.fillStyle = '#fff';
              CANVAS.ctx.fillRect(0,0,CANVAS.cv.width,CANVAS.cv.height);
              CANVAS.ctx.drawImage(img, 0, 0);
            }catch(e){}
          };
          img.src = carried.png;
        }
      }
    }
  }finally{
    rendering = false;
  }
  try{ if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0,0); }catch(e){}
}

function cloudStatusLine(){
  const dot = c => '<i style="width:9px;height:9px;border-radius:50%;background:' + c +
                   ';display:inline-block;margin-right:6px"></i>';
  let color = 'var(--ink-3)', msg = '', tap = '';
  if(!cloudReady()){
    color = 'var(--warn)';
    msg = 'Stories are kept on this device. A grown-up can connect a Google Sheet to sync between devices.';
  }else{
    const st = CLOUD_STATE.status;
    if(st === 'error'){
      color = 'var(--bad)';
      msg = 'Sync problem: ' + esc(CLOUD_STATE.message);
      tap = ' data-act="retryRead"';            /* make "try again" actually do it */
    }
    else if(st === 'ok')    { color = 'var(--ok)';   msg = esc(CLOUD_STATE.message || 'Synced.'); }
    else if(st === 'reading'){ color = 'var(--sprout)'; msg = esc(CLOUD_STATE.message) + ' ' + spin(); }
    else if(st === 'sending'){ color = 'var(--sprout)'; msg = esc(CLOUD_STATE.message) + ' ' + spin(); }
    else                    { msg = 'Connected to the Sheet. Log in to sync.'; }
  }
  const style = 'gap:0' + (tap ? ';cursor:pointer' : '');
  return '<div class="card small muted row" style="' + style + '"' + tap + '>' +
         dot(color) + '<span>' + msg + '</span></div>';
}

/* A small inline spinner so "reading" visibly means reading. Pure CSS, added
   once — no dependency, no image, no extra request. */
let spinnerCSSAdded = false;
function spin(){
  if(typeof document === 'undefined') return '';
  if(!spinnerCSSAdded){
    spinnerCSSAdded = true;
    const head = document.head
      || (typeof document.getElementsByTagName === 'function'
            && document.getElementsByTagName('head')[0]);
    if(head && head.appendChild){
      const s = document.createElement('style');
      s.textContent = '@keyframes pbspin{to{transform:rotate(360deg)}}'
        + '.pbspin{display:inline-block;width:10px;height:10px;margin-left:6px;'
        + 'vertical-align:-1px;border:2px solid currentColor;border-right-color:transparent;'
        + 'border-radius:50%;animation:pbspin .7s linear infinite}';
      head.appendChild(s);
    }
  }
  return '<i class="pbspin"></i>';
}

/* ==========================================================================
   10. CANVAS (drawing)
   ========================================================================== */

const CANVAS = { cv:null, ctx:null, color:'#2E2A24', drawing:false };

function initCanvas(){
  const cv = $('#cv');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth = 5; ctx.lineCap='round'; ctx.lineJoin='round';
  CANVAS.cv = cv; CANVAS.ctx = ctx; CANVAS.color = CANVAS.color || '#2E2A24';

  const pos = ev => {
    const r = cv.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x:(p.clientX - r.left) * (cv.width / r.width),
             y:(p.clientY - r.top ) * (cv.height / r.height) };
  };
  const start = ev => { ev.preventDefault(); CANVAS.drawing = true;
    const q = pos(ev); ctx.beginPath(); ctx.moveTo(q.x,q.y); };
  const move  = ev => { if(!CANVAS.drawing) return; ev.preventDefault();
    const q = pos(ev); ctx.strokeStyle = CANVAS.color; ctx.lineTo(q.x,q.y); ctx.stroke(); };
  const stop  = () => { CANVAS.drawing = false; };

  cv.addEventListener('mousedown', start);
  cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', stop);
  cv.addEventListener('touchstart', start, { passive:false });
  cv.addEventListener('touchmove',  move,  { passive:false });
  cv.addEventListener('touchend',   stop);
}


/* ==========================================================================
   11. DRAFT PLUMBING
   ========================================================================== */

function openEditor(postId){
  const p = DB.posts.find(x => x.id === postId);
  if(!p) return;
  DRAFT = {
    id:p.id, kidId:p.kidId,
    title:p.title || '', body:p.body || '',
    attachments: JSON.parse(JSON.stringify(p.attachments || []))
  };
  VIEW.name='editor'; VIEW.postId = p.id;
  render();
}

function syncDraftFromDOM(){
  if(!DRAFT) return;
  const t = $('#fTitle'), b = $('#fBody');
  if(t) DRAFT.title = t.value;
  if(b) DRAFT.body  = b.value;
}
/* Drafts live only in memory until the child presses Save. There is no local
   storage, so there is no autosave — the Sheet is the only place stories exist. */
function onDraftChanged(){
  syncDraftFromDOM();
  const hint = $('#saveHint');
  if(hint) hint.textContent = 'not saved yet — press Save when done';
}
function renderEditorPics(){
  if(!DRAFT) return;
  const host = $('.pics');
  const html = (DRAFT.attachments||[]).map((a,i) =>
    '<div class="pic"><img src="' + esc(picUrl(a)) + '" alt="">' +
    '<span class="dot" style="background:' + (a.driveId ? 'var(--ok)' : 'var(--ink-3)') + '"></span>' +
    '<button class="x" data-act="delPic" data-i="' + i + '">✕</button></div>').join('');
  if(host) host.innerHTML = html;
  else if(html && DRAFT){
    const box = $('#drawBox');
    if(box) box.insertAdjacentHTML('beforebegin', '<div class="pics">' + html + '</div>');
  }
}

/* Pictures go up one at a time, after the story itself is safe. A picture
   that fails is left marked, not lost — it is still on the device. */
async function queuePictureUpload(post){
  const pend = (post.attachments||[]).filter(a => !a.driveId && (a.src || a.thumb));
  if(!pend.length || !cloudReady()) return;
  const kid = kidById(post.kidId) || {};
  let filed = 0;
  for(const att of pend){
    try{
      await uploadPicture(att, {
        kidId:post.kidId, kidName:kid.name, postId:post.id, title:post.title
      });
      filed++;
    }catch(e){
      toast('A picture could not be filed: ' + e.message, 'bad');
      break;
    }
  }
  /* The text went up BEFORE the pictures, so the Sheet's picture count was
     written as zero. Now that files have landed in Drive, send the snapshot
     again or the Sheet keeps saying a story has no pictures. */
  if(filed){
    suppressPush = false;
    await pushToSheet().catch(() => {});
  }
}


/* ==========================================================================
   12. EVENT WIRING
   ========================================================================== */

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  if(!ACTIONS[act]) return;
  ev.preventDefault();
  ev.stopPropagation();
  ACTIONS[act](t.dataset);
});

document.addEventListener('input', ev => {
  const id = ev.target.id;
  if(id === 'fTitle' || id === 'fBody') onDraftChanged();
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.id !== 'fFile') return;
  const f = el.files && el.files[0];
  if(!f || !DRAFT) return;
  const rd = new FileReader();
  rd.onload = () => {
    DRAFT.attachments = DRAFT.attachments || [];
    DRAFT.attachments.push({ id:uid(), kind:'photo', src:rd.result, thumb:rd.result, at:Date.now() });
    onDraftChanged(); renderEditorPics();
    toast('Photo added — it will be filed when you save','ok');
  };
  rd.readAsDataURL(f);
  el.value = '';
});

document.addEventListener('keydown', ev => {
  /* The login wall owns Enter while it is up. A form that needs a mouse is a
     form a child cannot use on a tablet. */
  if(LOCKED){
    if(ev.key === 'Enter'){ ev.preventDefault(); ACTIONS.loginTry(); }
    return;
  }
  if(ev.key === 'Enter' && GATE.show && document.activeElement && document.activeElement.id === 'gIn'){
    ev.preventDefault(); ACTIONS.gateOk();
  }
  if(ev.key === 'Escape' && GATE.show) closeGate();
});

/* Leaving with unsaved words? Save them. */
window.addEventListener('beforeunload', () => { if(DRAFT) saveDraft(); });
document.addEventListener('visibilitychange', () => {
  if(document.hidden && DRAFT) saveDraft();
});


/* ==========================================================================
   13. BOOT
   ========================================================================== */

function boot(){
  /* The Google Sheet is the sole source of truth, but we do NOT pull on every
     boot — that would race with user actions and silently discard work. Instead:
     - syncOnLogin() pulls when the user explicitly signs in
     - the user can manually refresh via Grown-ups → Check this device
     - background sync only happens when the user is not actively editing */
  /* With no localStorage, every reload starts fresh. SESSION is null and
     LOCKED is true until the family password is entered. */
  SESSION = null;
  LOCKED = true;
  LOGIN_ERR = '';
  render();
}

boot();

/* ---- the watchdog ---------------------------------------------------------
   Armed when an operation STARTS and cleared when it ENDS, so it measures the
   operation rather than the age of the page.

   An earlier version armed a single 75s timer at page load. That had two
   failure modes, both real:
     - a read begun at t=73s was declared failed two seconds later, while it was
       still running perfectly well (reproduced: error at +75348ms, data at
       +79404ms);
     - a read begun after t=75s had no backstop at all, because the timer had
       already fired and done nothing.
   It also contradicted the retry budget: 3 attempts could legitimately run for
   ~79s, so a 75s watchdog was guaranteed to cry wolf on a slow connection.

   Now the window is derived from the retry policy (watchdogMs()), so it can
   only fire when something is genuinely wedged. */
let watchdogTimer = null;
function armWatchdog(){
  clearWatchdog();
  watchdogTimer = setTimeout(() => {
    watchdogTimer = null;
    if(CLOUD_STATE.status === 'reading' || CLOUD_STATE.status === 'sending'){
      setCloudState('error', 'The Sheet is taking a long time to answer. '
        + 'Please check your connection and tap to try again.');
    }
  }, watchdogMs());
}
function clearWatchdog(){
  if(watchdogTimer){ clearTimeout(watchdogTimer); watchdogTimer = null; }
}

/* ---- exposed for tests only -------------------------------------------- */
if(typeof window !== 'undefined'){
  window.__pb = {
    DB: () => DB, SET: () => SET,
    render, normalizeSettings, freshDB,
    pwOk, hashPw, wordCount, uid,
    pullFromSheet, pushToSheet, syncOnLogin,
    cloudReady, cloudCfg, driveFolderId, folderReady,
    setDB: d => { DB = d; }, setSET: s => { SET = normalizeSettings(s); },
